<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Color Prediction Game</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #1f3c88, #3f6db3);
            color: #ffffff;
            font-family: Inter, system-ui, sans-serif;
        }
        .login-panel {
            width: min(480px, 90vw);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 24px;
            box-shadow: 0 36px 80px rgba(0,0,0,0.25);
            backdrop-filter: blur(14px);
            padding: 36px;
        }
        .login-panel h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 3vw, 2.6rem);
        }
        .login-panel p {
            margin: 0 0 26px;
            color: rgba(255,255,255,0.78);
            line-height: 1.6;
        }
        .field {
            margin-bottom: 18px;
        }
        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.88);
        }
        .field input {
            width: 100%;
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.08);
            color: white;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 1rem;
            outline: none;
        }
        .field input:focus {
            border-color: #7fb3ff;
            box-shadow: 0 0 20px rgba(127,179,255,0.2);
        }
        .buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .btn {
            border: none;
            border-radius: 14px;
            padding: 14px 20px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
            min-width: 160px;
        }
        .btn-primary {
            background: #3f7bff;
            color: white;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.16);
            color: white;
        }
        .btn:hover {
            transform: translateY(-1px);
        }
        .panel-note {
            margin-top: 18px;
            color: rgba(255,255,255,0.72);
        }
        .status {
            margin-top: 22px;
            padding: 14px 18px;
            border-radius: 16px;
            background: rgba(255,255,255,0.08);
            color: #eef3ff;
            min-height: 48px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <section class="login-panel">
        <h1>Admin Panel Login</h1>
        <p>Use the admin username and password to sign in. This is a temporary admin login for testing.</p>

        <div class="field">
            <label for="username">Username</label>
            <input id="username" value="admin" placeholder="admin" />
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" value="admin" placeholder="admin" />
        </div>
        <div class="buttons">
            <button id="loginBtn" class="btn btn-primary">Login</button>
        </div>
        <div class="status" id="statusMessage">Ready to login.</div>
        <p class="panel-note">Use the admin username and password below to access the dashboard.</p>
    </section>
    <script>
        const statusMessage = document.getElementById('statusMessage');
        const apiBase = '/admin-auth';

        if (localStorage.getItem('adminAuthKey')) {
            window.location.href = '/admin.html';
        }

        function setStatus(text, isError = false) {
            statusMessage.textContent = text;
            statusMessage.style.background = isError ? 'rgba(255,75,75,0.15)' : 'rgba(255,255,255,0.08)';
            statusMessage.style.color = isError ? '#ffc9c9' : '#eef3ff';
        }

        async function loginAdmin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!username || !password) {
                return setStatus('Username and password are required.', true);
            }
            setStatus('Logging in...');
            const response = await fetch(`${apiBase}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const json = await response.json();
            if (!json.meta.status) {
                return setStatus(json.meta.msg, true);
            }
            localStorage.setItem('adminAuthKey', json.token);
            setStatus('Login successful — redirecting...', false);
            setTimeout(() => window.location.href = '/admin.html', 400);
        }

        document.getElementById('loginBtn').addEventListener('click', loginAdmin);
    </script>
</body>
</html>
